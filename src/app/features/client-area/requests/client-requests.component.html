<section class="dashboard"><div class="page-title"><div><p class="eyebrow">Área do cliente</p><h1>Solicitações</h1></div><button class="primary-button">+ Nova solicitação</button></div><section class="insured-module requests-module"><div class="module-heading"><div><h2>Acompanhe suas solicitações</h2><p>Consulte o andamento dos seus atendimentos e pedidos.</p></div></div><div class="request-list">@for (request of data.requests; track request.id) { <article><span class="request-icon">▤</span><div><strong>{{ request.type }}</strong><p>{{ request.description }}</p><small>{{ request.id }} · {{ request.createdAt }}</small></div><span class="status" [class.pending]="request.status === 'Em análise'">{{ request.status }}</span><span class="arrow">→</span></article> }</div></section></section>
